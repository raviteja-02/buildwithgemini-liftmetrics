<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiftMetrics - AI Workout & PR Coach</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root { --accent:#ea580c; --accent-hover:#c2410c; --bg:#f8fafc; --border:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); display:flex; flex-direction:column; height:100vh; }
  header { background:var(--accent); color:#fff; padding:.9rem 1.2rem; font-weight:700; box-shadow:0 2px 4px rgba(0,0,0,.08); }
  #log { flex:1; overflow-y:auto; padding:1.2rem; max-width:780px; width:100%; margin:0 auto; }
  .msg { margin:.6rem 0; }
  .msg.user { text-align:right; }
  .bubble { display:inline-block; padding:.6rem .9rem; border-radius:12px; background:#fff; border:1px solid var(--border); text-align:left; max-width:90%; white-space:pre-wrap; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .msg.user .bubble { background:var(--accent); color:#fff; border:none; }
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich { background:transparent; border:none; padding:0; max-width:100%; white-space:normal; box-shadow:none; }
  #prompts-bar { display:flex; gap:.5rem; padding:.6rem 1rem; background:#fff; border-top:1px solid var(--border); overflow-x:auto; }
  .prompt-chip { background:#f1f5f9; border:1px solid var(--border); border-radius:16px; padding:.4rem .85rem; font-size:.85rem; color:#334155; cursor:pointer; white-space:nowrap; transition:all .15s ease; font-weight:500; }
  .prompt-chip:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  form { display:flex; gap:.5rem; padding:1rem; border-top:1px solid var(--border); background:#fff; }
  input { flex:1; padding:.7rem; border:1px solid var(--border); border-radius:8px; font-size:1rem; }
  button.send-btn { padding:.7rem 1.2rem; border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; transition:background .15s ease; }
  button.send-btn:hover { background:var(--accent-hover); }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid var(--border); border-radius:12px; padding:1rem; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.4rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.4; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:#666; }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.4rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:8px; display:block; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
  .timer-btn { background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.35); border-radius:5px; color:#fff; font-size:0.75rem; padding:0.25rem 0.5rem; cursor:pointer; font-weight:600; transition:all .15s ease; }
  .timer-btn:hover { background:rgba(255,255,255,0.35); }
  .timer-btn.active { background:#fff; color:var(--accent); border-color:#fff; }

  /* Plate Calculator Modal Styles */
  #plate-modal { display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.65); align-items:center; justify-content:center; backdrop-filter:blur(3px); }
  .modal-content { background:#1e293b; color:#f8fafc; padding:1.5rem; border-radius:12px; width:90%; max-width:440px; box-shadow:0 10px 25px rgba(0,0,0,0.5); border:1px solid #334155; }
  .modal-input { width:100%; background:#0f172a; border:1px solid #475569; color:#f8fafc; padding:0.6rem 0.8rem; border-radius:6px; font-size:1rem; margin-top:0.4rem; box-sizing:border-box; }
  .modal-btn { background:var(--accent); color:#fff; border:none; border-radius:6px; padding:0.55rem 1rem; font-weight:bold; cursor:pointer; margin-top:0.8rem; width:100%; transition:opacity .15s; }
  .modal-btn:hover { opacity:0.9; }
</style>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
<header>
  <div style="max-width:920px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.6rem;">
    <div style="display:flex; align-items:center; gap:0.6rem;">
      <span style="font-size:1.4rem;">🏋️</span>
      <div>
        <div style="font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:0.4rem;">
          LiftMetrics <span style="font-size:0.65rem; background:rgba(255,255,255,0.25); padding:2px 6px; border-radius:10px;">🇮🇳 Indian & Global</span>
        </div>
        <div style="font-size:0.75rem; opacity:0.9;">AI Workout & PR Coach</div>
      </div>
    </div>

    <!-- Lifter RPG Rank & Streak Badge -->
    <div style="display:flex; align-items:center; gap:0.4rem; background:rgba(0,0,0,0.28); padding:0.25rem 0.65rem; border-radius:14px; font-size:0.78rem; font-weight:600;">
      <span>🔥 14-Day Streak</span>
      <span style="opacity:0.4;">|</span>
      <span title="Level 6 Titan — Dangal Mode!">👑 Diamond Lifter</span>
    </div>

    <!-- Rest Interval Timer Widget -->
    <div id="rest-timer-widget" style="display:flex; align-items:center; gap:0.35rem; background:rgba(0,0,0,0.22); padding:0.25rem 0.55rem; border-radius:18px; font-family:ui-monospace,monospace;">
      <span style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.5px; opacity:0.9;">⏱️ Rest:</span>
      <span id="timer-display" style="font-weight:bold; font-size:0.95rem; min-width:44px; text-align:center;">00:00</span>
      <button type="button" class="timer-btn" onclick="setTimer(60)">60s</button>
      <button type="button" class="timer-btn" onclick="setTimer(90)">90s</button>
      <button type="button" class="timer-btn" onclick="setTimer(180)">3m</button>
      <button type="button" class="timer-btn" onclick="toggleTimer()" id="timer-toggle-btn">Start</button>
      <button type="button" class="timer-btn" onclick="resetTimer()">Reset</button>
    </div>

    <div style="display:flex; align-items:center; gap:0.4rem;">
      <!-- Plate Calculator Modal Trigger -->
      <button type="button" class="timer-btn" onclick="openPlateModal()" style="padding:0.35rem 0.6rem; font-size:0.8rem; display:flex; align-items:center; gap:0.25rem;">
        🔢 Plates
      </button>

      <!-- Unit Toggle Button -->
      <button type="button" id="unit-toggle-btn" class="timer-btn" onclick="toggleUnit()" style="padding:0.35rem 0.6rem; font-size:0.8rem; font-weight:700;">
        🇮🇳 KG
      </button>

      <!-- Export Session Log Button -->
      <button type="button" onclick="exportWorkoutLog()" style="background:#fff; color:var(--accent); border:none; border-radius:6px; padding:0.35rem 0.65rem; font-size:0.8rem; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:0.25rem; box-shadow:0 1px 2px rgba(0,0,0,.1);">
        📥 Export
      </button>
    </div>
  </div>
</header>

<!-- Plate Calculator Pop-up Modal -->
<div id="plate-modal">
  <div class="modal-content">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
      <h3 style="margin:0; font-size:1.15rem; display:flex; align-items:center; gap:0.3rem;">🏋️ Barbell Plate Calculator</h3>
      <button type="button" onclick="closePlateModal()" style="background:none; border:none; color:#94a3b8; font-size:1.3rem; cursor:pointer;">&times;</button>
    </div>
    <div style="font-size:0.85rem; color:#94a3b8; margin-bottom:0.5rem;">Quickly calculate exact plate loading per sleeve for a standard 20kg (or 45lb) bar:</div>
    <label style="font-size:0.85rem; font-weight:600;">Target Weight (<span id="modal-unit-label">KG</span>):</label>
    <input type="number" id="plate-target-input" class="modal-input" placeholder="e.g. 100, 140, 225" value="100">
    
    <label style="font-size:0.85rem; font-weight:600; margin-top:0.6rem; display:block;">Bar Weight:</label>
    <select id="plate-bar-select" class="modal-input" style="padding:0.5rem;">
      <option value="20">20 kg Standard Olympic Bar</option>
      <option value="15">15 kg Women's Olympic Bar</option>
      <option value="10">10 kg Local Straight Rod</option>
      <option value="45">45 lbs Standard Olympic Bar</option>
    </select>

    <div id="plate-modal-result" style="margin-top:0.8rem; padding:0.6rem; background:#0f172a; border-radius:6px; font-family:monospace; font-size:0.85rem; min-height:48px; border:1px solid #334155;">
      Sleeve: [20kg] [20kg] (40kg per side + 20kg bar = 100kg)
    </div>

    <button type="button" class="modal-btn" onclick="calculateModalPlates()">Calculate Sleeve Plates</button>
    <button type="button" style="background:none; border:1px solid #475569; color:#cbd5e1; border-radius:6px; padding:0.45rem; width:100%; margin-top:0.4rem; cursor:pointer; font-size:0.85rem;" onclick="askCoachPlates()">
      Ask LiftMetrics Coach in Chat &rarr;
    </button>
  </div>
</div>

<div id="log"></div>
<div id="prompts-bar">
  <button type="button" class="prompt-chip" onclick="sendPrompt('Show me all the exercises listed in the catalog categorized by muscle group')">📋 List All Exercises</button>
  <button type="button" class="prompt-chip" onclick="sendPrompt('How to perform bicep curls with dumbbells? Please provide correct form, movement execution, body posture, and how many reps to do.')">💪 Dumbbell Bicep Curls Form</button>
  <button type="button" class="prompt-chip" onclick="sendPrompt('I need a budget-friendly diet plan. My budget is ₹150/day and I am a pure vegetarian looking to bulk and build muscle.')">🍱 ₹150/Day Veg Bulk Diet</button>
  <button type="button" class="prompt-chip" onclick="sendPrompt('What is a high-protein budget diet plan for ₹250/day for body recomposition with eggs and chicken?')">🍗 ₹250/Day Non-Veg Cut</button>
  <button type="button" class="prompt-chip" onclick="sendPrompt('Calculate plate loading for 140 kg on a 20kg Olympic barbell')">🏋️‍♂️ Plate Math: 140 KG</button>
  <button type="button" class="prompt-chip" onclick="sendPrompt('Calculate my lifter rank and strength stats: Bodyweight 72kg, Deadlift 160kg, Squat 120kg, Bench 90kg')">⚡ My Lifter Rank & Badges</button>
  <button type="button" class="prompt-chip" onclick="sendPrompt('Calculate my 1RM for 100 kg x 5 reps on Bench Press')">📊 1RM: 100kg x 5 Bench</button>
</div>
<form id="form">
  <input id="input" placeholder="Ask LiftMetrics (e.g. how to perform bicep curls, list all exercises, diet plan, plate math, 1RM)…" autocomplete="off" autofocus>
  <button class="send-btn">Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;

  // Gamification: Trigger celebratory Confetti and Audio Fanfare on PR or Baahubali milestone
  const lower = textStr.toLowerCase();
  if (lower.includes("new personal record") || lower.includes("first pr set") || lower.includes("shabash") || lower.includes("baahubali")) {
    triggerCelebration();
  }
}

function triggerCelebration() {
  try {
    if (typeof confetti === "function") {
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 },
        colors: ['#38bdf8', '#10b981', '#f59e0b', '#ec4899', '#ffffff']
      });
    }
    playFanfare();
  } catch (e) {}
}

function playFanfare() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 arpeggio
    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
      gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.12);
      osc.stop(ctx.currentTime + idx * 0.12 + 0.36);
    });
  } catch (e) {}
}

// Unit Toggle State (Default: KG)
let currentUnit = "KG";
function toggleUnit() {
  currentUnit = (currentUnit === "KG") ? "LBS" : "KG";
  document.getElementById("unit-toggle-btn").textContent = (currentUnit === "KG") ? "🇮🇳 KG" : "🇺🇸 LBS";
  document.getElementById("modal-unit-label").textContent = currentUnit;
  const barSelect = document.getElementById("plate-bar-select");
  if (currentUnit === "LBS") {
    barSelect.value = "45";
    document.getElementById("plate-target-input").value = "225";
  } else {
    barSelect.value = "20";
    document.getElementById("plate-target-input").value = "100";
  }
  calculateModalPlates();
}

// Plate Calculator Modal Controls
function openPlateModal() {
  document.getElementById("plate-modal").style.display = "flex";
  calculateModalPlates();
}

function closePlateModal() {
  document.getElementById("plate-modal").style.display = "none";
}

window.onclick = function(event) {
  const modal = document.getElementById("plate-modal");
  if (event.target === modal) closePlateModal();
};

function calculateModalPlates() {
  const target = parseFloat(document.getElementById("plate-target-input").value) || 0;
  const bar = parseFloat(document.getElementById("plate-bar-select").value) || 20;
  const resDiv = document.getElementById("plate-modal-result");

  if (target < bar) {
    resDiv.textContent = `Target (${target}) is lighter than bar (${bar}). Lift empty bar!`;
    return;
  }
  if (target === bar) {
    resDiv.textContent = `Empty bar! No plates needed for ${bar} ${currentUnit}.`;
    return;
  }

  const perSide = (target - bar) / 2.0;
  const plates = (currentUnit === "KG")
    ? [25, 20, 15, 10, 5, 2.5, 1.25]
    : [45, 35, 25, 10, 5, 2.5];

  let remaining = perSide;
  const used = [];
  for (const p of plates) {
    const c = Math.floor(remaining / p);
    if (c > 0) {
      for (let i = 0; i < c; i++) used.push(`${p}${currentUnit.toLowerCase()}`);
      remaining -= c * p;
    }
  }

  const sleeveStr = used.map(p => `[${p}]`).join(" ");
  resDiv.innerHTML = `<strong>Sleeve Load:</strong> ${sleeveStr || '(none)'}<br>` +
    `<strong>Per Side:</strong> ${perSide} ${currentUnit} | <strong>Bar:</strong> ${bar} ${currentUnit} | <strong>Total:</strong> ${target} ${currentUnit}`;
}

function askCoachPlates() {
  const target = document.getElementById("plate-target-input").value;
  const bar = document.getElementById("plate-bar-select").value;
  closePlateModal();
  sendPrompt(`Calculate plate loading for ${target} ${currentUnit.toLowerCase()} on a ${bar} ${currentUnit.toLowerCase()} barbell`);
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

/* --- Rest Interval Timer & Session Export Logic --- */
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;

function updateTimerDisplay() {
  const m = String(Math.floor(timerSeconds / 60)).padStart(2, "0");
  const s = String(timerSeconds % 60).padStart(2, "0");
  document.getElementById("timer-display").textContent = `${m}:${s}`;
}

function setTimer(secs) {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = secs;
  updateTimerDisplay();
  startTimer();
}

function startTimer() {
  if (timerRunning) return;
  if (timerSeconds <= 0) timerSeconds = 90;
  timerRunning = true;
  document.getElementById("timer-toggle-btn").textContent = "Pause";
  timerInterval = setInterval(() => {
    if (timerSeconds > 0) {
      timerSeconds--;
      updateTimerDisplay();
      if (timerSeconds === 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById("timer-toggle-btn").textContent = "Start";
        playBeep();
      }
    }
  }, 1000);
}

function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById("timer-toggle-btn").textContent = "Resume";
  } else {
    startTimer();
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  updateTimerDisplay();
  document.getElementById("timer-toggle-btn").textContent = "Start";
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (e) {}
}

function exportWorkoutLog() {
  const messages = document.querySelectorAll("#log .msg");
  if (!messages.length) {
    alert("No workout conversations or logged sessions to export yet.");
    return;
  }
  let md = "# 🏋️ LiftMetrics Session & Workout Export\n\nGenerated on: " + new Date().toLocaleString() + "\n\n---\n\n";
  messages.forEach(m => {
    const isUser = m.classList.contains("user");
    const role = isUser ? "**Athlete**" : "**LiftMetrics Coach**";
    const text = m.innerText.trim();
    md += `### ${role}\n${text}\n\n`;
  });

  const blob = new Blob([md], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `liftmetrics_session_${new Date().toISOString().slice(0, 10)}.md`;
  a.click();
}
</script>
