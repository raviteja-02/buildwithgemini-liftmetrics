<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiftMetrics - AI Workout & PR Coach</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root { --accent:#ea580c; --accent-hover:#c2410c; --bg:#f8fafc; --border:#e2e8f0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); display:flex; flex-direction:column; height:100vh; }
  header { background:var(--accent); color:#fff; padding:.9rem 1.2rem; font-weight:700; box-shadow:0 2px 4px rgba(0,0,0,.08); }
  #log { flex:1; overflow-y:auto; padding:1.2rem; max-width:780px; width:100%; margin:0 auto; }
  .msg { margin:.6rem 0; }
  .msg.user { text-align:right; }
  .bubble { display:inline-block; padding:.6rem .9rem; border-radius:12px; background:#fff; border:1px solid var(--border); text-align:left; max-width:90%; white-space:pre-wrap; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .msg.user .bubble { background:var(--accent); color:#fff; border:none; }
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich { background:transparent; border:none; padding:0; max-width:100%; white-space:normal; box-shadow:none; }
  #prompts-bar { display:flex; gap:.5rem; padding:.6rem 1rem; background:#fff; border-top:1px solid var(--border); overflow-x:auto; }
  .prompt-chip { background:#f1f5f9; border:1px solid var(--border); border-radius:16px; padding:.4rem .85rem; font-size:.85rem; color:#334155; cursor:pointer; white-space:nowrap; transition:all .15s ease; font-weight:500; }
  .prompt-chip:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
  form { display:flex; gap:.5rem; padding:1rem; border-top:1px solid var(--border); background:#fff; }
  input { flex:1; padding:.7rem; border:1px solid var(--border); border-radius:8px; font-size:1rem; }
  button.send-btn { padding:.7rem 1.2rem; border:none; border-radius:8px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; transition:background .15s ease; }
  button.send-btn:hover { background:var(--accent-hover); }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card { border:1px solid var(--border); border-radius:12px; padding:1rem; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.4rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.4; }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:#666; }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.4rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:8px; display:block; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
  .timer-btn { background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.35); border-radius:5px; color:#fff; font-size:0.75rem; padding:0.25rem 0.5rem; cursor:pointer; font-weight:600; transition:background .15s ease; }
  .timer-btn:hover { background:rgba(255,255,255,0.35); }
  .timer-btn.active { background:#fff; color:var(--accent); border-color:#fff; }
</style>
</head>
<body>
<header>
  <div style="max-width:860px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.6rem;">
    <div style="display:flex; align-items:center; gap:0.6rem;">
      <span style="font-size:1.4rem;">🏋️</span>
      <div>
        <div style="font-weight:700; font-size:1.05rem;">LiftMetrics</div>
        <div style="font-size:0.75rem; opacity:0.9;">AI Workout & PR Coach</div>
      </div>
    </div>

    <!-- Rest Interval Timer Widget -->
    <div id="rest-timer-widget" style="display:flex; align-items:center; gap:0.4rem; background:rgba(0,0,0,0.22); padding:0.3rem 0.65rem; border-radius:18px; font-family:ui-monospace,monospace;">
      <span style="font-size:0.8rem; text-transform:uppercase; letter-spacing:0.5px; opacity:0.9;">⏱️ Rest:</span>
      <span id="timer-display" style="font-weight:bold; font-size:1.05rem; min-width:48px; text-align:center;">00:00</span>
      <button type="button" class="timer-btn" onclick="setTimer(60)">60s</button>
      <button type="button" class="timer-btn" onclick="setTimer(90)">90s</button>
      <button type="button" class="timer-btn" onclick="setTimer(180)">3m</button>
      <button type="button" class="timer-btn" onclick="toggleTimer()" id="timer-toggle-btn">Start</button>
      <button type="button" class="timer-btn" onclick="resetTimer()">Reset</button>
    </div>

    <!-- Export Session Log Button -->
    <button type="button" onclick="exportWorkoutLog()" style="background:#fff; color:var(--accent); border:none; border-radius:6px; padding:0.35rem 0.75rem; font-size:0.82rem; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:0.3rem; box-shadow:0 1px 2px rgba(0,0,0,.1);">
      📥 Export Log
    </button>
  </div>
</header>
<div id="log"></div>
<div id="prompts-bar">
  <button type="button" class="prompt-chip" onclick="sendPrompt('Calculate my 1RM for 225 lbs x 5 reps on Bench Press')">📊 1RM: 225x5 Bench</button>
  <button type="button" class="prompt-chip" onclick="sendPrompt('Plot my Deadlift strength and volume progression chart')">📈 Plot Deadlift Progress</button>
  <button type="button" class="prompt-chip" onclick="sendPrompt('Log today\'s workout: Squats 3 sets of 5 at 315 lbs')">📝 Log: Squats 3x5 @ 315</button>
  <button type="button" class="prompt-chip" onclick="sendPrompt('Show proper Romanian Deadlift form with bar path and cues')">📸 Form Guide: RDL</button>
  <button type="button" class="prompt-chip" onclick="sendPrompt('What does sports science recommend for rest intervals on heavy compound lifts?')">🔬 Science: Rest Times</button>
</div>
<form id="form">
  <input id="input" placeholder="Ask LiftMetrics (e.g. 1RM calc, plot progress, log workout, form cues, science)…" autocomplete="off" autofocus>
  <button class="send-btn">Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";   // clear the "…" placeholder
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    // Read as text first, then parse. If the proxy ever returns a non-JSON error
    // page (e.g. a plain "Internal Server Error"), show that body instead of a
    // cryptic "Unexpected token" JSON error.
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});

/* --- Rest Interval Timer & Session Export Logic --- */
let timerInterval = null;
let timerSeconds = 0;
let timerRunning = false;

function updateTimerDisplay() {
  const m = String(Math.floor(timerSeconds / 60)).padStart(2, "0");
  const s = String(timerSeconds % 60).padStart(2, "0");
  document.getElementById("timer-display").textContent = `${m}:${s}`;
}

function setTimer(secs) {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = secs;
  updateTimerDisplay();
  startTimer();
}

function startTimer() {
  if (timerRunning) return;
  if (timerSeconds <= 0) timerSeconds = 90;
  timerRunning = true;
  document.getElementById("timer-toggle-btn").textContent = "Pause";
  timerInterval = setInterval(() => {
    if (timerSeconds > 0) {
      timerSeconds--;
      updateTimerDisplay();
      if (timerSeconds === 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById("timer-toggle-btn").textContent = "Start";
        playBeep();
      }
    }
  }, 1000);
}

function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById("timer-toggle-btn").textContent = "Resume";
  } else {
    startTimer();
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerSeconds = 0;
  updateTimerDisplay();
  document.getElementById("timer-toggle-btn").textContent = "Start";
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (e) {}
}

function exportWorkoutLog() {
  const messages = document.querySelectorAll("#log .msg");
  if (!messages.length) {
    alert("No workout conversations or logged sessions to export yet.");
    return;
  }
  let md = "# 🏋️ LiftMetrics Session & Workout Export\n\nGenerated on: " + new Date().toLocaleString() + "\n\n---\n\n";
  messages.forEach(m => {
    const isUser = m.classList.contains("user");
    const role = isUser ? "**Athlete**" : "**LiftMetrics Coach**";
    const text = m.innerText.trim();
    md += `### ${role}\n${text}\n\n`;
  });

  const blob = new Blob([md], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `liftmetrics_session_${new Date().toISOString().slice(0, 10)}.md`;
  a.click();
}
</script>
</body>
</html>
